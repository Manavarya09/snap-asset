name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main, 'phase/**']

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (optional)
        run: npx playwright install --with-deps || true

      - name: Run tests
        run: npm test
        env:
          CI: true

  uploader-integration:
    name: Uploader integration tests
    runs-on: ubuntu-latest
    if: ${{ env.RUN_UPLOADER_INTEGRATION == '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run uploader integration tests
        run: node --test tests/uploader.integration.test.js
        env:
          RUN_UPLOADER_INTEGRATION: '1'

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - run: npm ci
      - run: npm run lint
